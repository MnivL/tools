[project]
name = "any2excel"
version = "0.1.0"
description = "将 JSON / JSONL 数据转换为 Excel 的工具集"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.5",
    "pydantic>=2.7.0",
]

[project.scripts]
json2excel = "any2excel.json2excel:main"
jsonl2excel = "any2excel.jsonl2excel:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any2excel"]